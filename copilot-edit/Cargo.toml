# The scene editor. Held to the same weaker dependency rule as copilot-sim:
# it runs on a host with an OS, and writing a GUI toolkit is not the point of
# the project. Neither crate is ever a dependency of `copilot`.
#
# `eframe`/`egui` is the concession. It is immediate-mode, which suits an editor
# whose entire state is a scene tree that is re-read from disk anyway, and it
# needs no build system beyond cargo on Windows and Linux.

[package]
name = "copilot-edit"
description = "Visual editor for copilot scene files"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
copilot = { path = "../copilot", features = ["std"] }
eframe = { version = "0.29", default-features = false, features = [
  "default_fonts",
  "glow",
] }
egui = "0.29"
rfd = "0.15"
# Implements the critical section the gauge table's cells are guarded by.
critical-section = { version = "1", features = ["std"] }

# The wire the car is spoken to over, and the two ways of carrying it.
#
# `cogware-can` is where the frames are defined, so the editor and the server
# cannot drift apart about what one looks like.
cogware-can = { git = "https://codeberg.org/Cogware/CogwareCan.git" }
# Bluetooth that works the same on Windows and Linux. It is async, so it runs
# on a thread of its own; see `upload::bluetooth`.
btleplug = "0.13"
tokio = { version = "1", features = ["rt", "time", "macros"] }
# The stream the radio's reports arrive on.
futures = "0.3"

[lints.rust]
missing_docs = "deny"
unsafe_op_in_unsafe_fn = "deny"
