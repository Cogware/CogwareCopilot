[package]
name = "cogwarecopilot"
version = "0.0.0"
authors = ["Justin Copenhaver<ninjagecko5000@gmail.com>", "Leah Rosenfeld<lynndoxxy@gmail.com>"]
edition = "2021"

[features]
default = ["bsp_rpi3"]
bsp_rpi3 = ["tock-registers"]
bsp_rpi4 = ["tock-registers"]
hyperpixel = []

##--------------------------------------------------------------------------------------------------
## Dependencies
##--------------------------------------------------------------------------------------------------

[dependencies]

# Optional dependencies
tock-registers = { version = "0.10", default-features = false, features = ["register_types"], optional = true }
qemu-exit = { version = "3", optional = true }
quiche-gl = { path = "../quiche-gl", default-features = false }
log = { version = "0.4.28", features = ["max_level_debug"] }
bcm2837-hal = { path = "./bcm2837-hal"}
embedded-hal = "1.0.0"


# Platform specific dependencies
[target.'cfg(target_arch = "aarch64")'.dependencies]
aarch64-cpu = { version = "11" }

##--------------------------------------------------------------------------------------------------
## Testing
##--------------------------------------------------------------------------------------------------

[dev-dependencies]

# Unit tests are done in the library part of the kernel.
[lib]
name = "libkernel"
test = false
bench = false

# Disable unit tests for the kernel binary.
[[bin]]
name = "kernel"
path = "src/main.rs"
test = false
bench = false

